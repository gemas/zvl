<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Zwemvereniging Lanaken</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="contact.css">
    <link rel="stylesheet" href="index.css">
    <script src="contact.js" defer></script>
    <script src="index.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>


    <section id="contact" class="contact">
        <div class="container">
            <h2>Contacteer Ons</h2>
            <div class="contact-tekst">
                <p>Kom eens langs bij een van onze trainingen voor een persoonlijke kennismaking of stuur een mail naar
                    <a href="mailto:zwemlanaken@gmail.com">zwemlanaken@gmail.com</a>. </p>
                <p>Liefst met vermelding wat je persoonlijke doelen en verwachtingen zijn vwb het zwemmen.</p>
            </div>
            <form action="#" method="POST" class="contact-form">
                <label for="name">Voornaam:</label>
                <input type="text" id="name" name="name" required>

                <label for="lastname">Achternaam:</label>
                <input type="text" id="lastname" name="lastname" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Telefoonnummer:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>

                <label for="message">Bericht:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="btn-primary"
                    onclick="window.location.href='mailto:zwemlanaken@gmail.com'">Verzenden</button>
            </form>
        </div>
    </section>


    <div id="footer-placeholder"></div>
</body>

</html>
