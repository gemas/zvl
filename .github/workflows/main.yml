name: Build and publish

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      if: success()
      run: |        
        docker build -t zvl:${{ github.sha }} -f Dockerfile .
        docker tag zvl:${{ github.sha }} zvl:latest

    - name: Log in to Docker Registry
      if: success()
      uses: docker/login-action@v3
      with:
        registry: nexus.gemas.synology.me/hosted
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image
      if: success()
      run: |
        docker tag zvl:${{ github.sha }} nexus.gemas.synology.me/hosted/zvl:${{ github.sha }}
        docker tag zvl:latest nexus.gemas.synology.me/hosted/zvl:latest
        docker push nexus.gemas.synology.me/hosted/zvl:${{ github.sha }}
        docker push nexus.gemas.synology.me/hosted/zvl:latest

    - name: Checkout target repository
      if: success()
      uses: actions/checkout@v4
      with:
        repository: 'gemas/kubernetes-deployments'  # Replace with target repo (e.g., 'myorg/config-repo')
        token: ${{ secrets.PAT_TOKEN }}
        path: 'target-repo'

    - name: Install yq
      if: success()
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Update file in target repository
      if: success()
      run: |
        cd target-repo
        # Update the image tag in the deployment.yaml file
        yq eval '.spec.template.spec.containers[0].image = "nexus.gemas.synology.me/hosted/zvl:${{ github.sha }}"' -i deployments/zvl/deployment.yaml

    - name: Commit and push changes
      if: success()
      run: |
        cd target-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Update from build in ${{ github.repository }} - Run #${{ github.run_number }}" || echo "No changes to commit"
        git push
