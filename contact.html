<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/Assets/favicon.png?v=3" type="image/png" />
    <link rel="apple-touch-icon" href="/Assets/favicon.png?v=3" />
    <title>Contact - Zwemvereniging Lanaken</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="contact.css">
    <script src="contact.js" defer></script>
    <script src="index.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <div id="header-placeholder"></div>


    <section id="contact" class="contact">
        <div class="container">
            <h2>Contacteer Ons</h2>
            <div class="contact-tekst">
                <p>Kom eens langs bij een van onze trainingen voor een persoonlijke kennismaking of stuur een mail naar
                    <a href="mailto:zwemlanaken@gmail.com">zwemlanaken@gmail.com</a>. </p>
                <p>Liefst met vermelding wat je persoonlijke doelen en verwachtingen zijn vwb het zwemmen.</p>
            </div>
            <form class="contact-form" novalidate>
                <div class="form-row">
                    <div class="form-field">
                        <label for="name">Voornaam <span class="req" aria-hidden="true">*</span></label>
                        <input type="text" id="name" name="name" autocomplete="given-name" required>
                        <p class="field-error" id="name-error" aria-live="polite"></p>
                    </div>
                    <div class="form-field">
                        <label for="lastname">Achternaam <span class="req" aria-hidden="true">*</span></label>
                        <input type="text" id="lastname" name="lastname" autocomplete="family-name" required>
                        <p class="field-error" id="lastname-error" aria-live="polite"></p>
                    </div>
                </div>

                <div class="form-field">
                    <label for="email">E-mailadres <span class="req" aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" autocomplete="email" inputmode="email"
                        placeholder="naam@voorbeeld.be" required>
                    <p class="field-error" id="email-error" aria-live="polite"></p>
                </div>

                <div class="form-field">
                    <label for="phone">Telefoonnummer <span class="optional">(optioneel)</span></label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel"
                        placeholder="bv. 0470 12 34 56">
                    <p class="field-error" id="phone-error" aria-live="polite"></p>
                </div>

                <div class="form-field">
                    <label for="message">Bericht <span class="req" aria-hidden="true">*</span></label>
                    <textarea id="message" name="message" rows="6" required
                        placeholder="Vertel ons kort wie je bent en wat je persoonlijke doelen en verwachtingen zijn vwb het zwemmen."></textarea>
                    <p class="field-error" id="message-error" aria-live="polite"></p>
                </div>

                <p class="form-hint"><span class="req">*</span> verplicht veld</p>

                <!-- Honeypot tegen spambots: onzichtbaar voor bezoekers -->
                <input type="checkbox" name="botcheck" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true">

                <button type="submit" class="btn-primary" id="submit-btn">Verzenden</button>

                <div class="form-status" id="form-status" role="status" aria-live="polite" hidden></div>
            </form>
        </div>
    </section>


    <div id="footer-placeholder"></div>
</body>

</html>
